name: faultdebug CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Compile Python sources
        run: python -m compileall -q faultdebug scripts
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel
      - name: Test relative compilation database indexing
        run: |
          python -m pip install --disable-pip-version-check .
          python test/index_linkage.py
      - name: Test fault-flow reports and read-only MCP
        run: python test/fault_report_test.py
      - name: Verify MCP stdio definitions and read-only calls
        run: python test/mcp_tool_metadata.py --output build/mcp-definition-audit.json
      - name: Upload inspected MCP definitions
        uses: actions/upload-artifact@v4
        with:
          name: mcp-definition-audit
          path: build/mcp-definition-audit.json
          if-no-files-found: error
      - name: Test service identity, budgets, snapshot pagination and real MCP parity
        run: |
          python test/service_identity_contract.py
          python test/service_query_contract.py
      - name: Test HTTP identity and local clock contracts
        run: |
          python test/http_context_contract.py
          python test/process_clock_contract.py
          python test/shop_http_context.py
          python test/retry_ledger_contract.py
          python test/keyed_lock_contract.py
          python test/shop_checkout_contract.py
          python test/http_fault_proxy_contract.py
      - name: Test cross-service report and container PID identities
        run: python test/service_report_test.py

  mcp-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build read-only MCP image
        run: docker build -f Dockerfile.mcp -t faultdebug-mcp:ci .
      - name: Check packaged MCP command
        run: docker run --rm faultdebug-mcp:ci --help

  clang18-cmake-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18-tools cmake ninja-build python3
      - name: Install adoption CLI dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Configure with Clang 18
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build-ci -G Ninja -DFAULTDEBUG_BUILD_TESTS=ON -DFAULTDEBUG_BUILD_SHOP=ON -DFAULTDEBUG_ENABLE_PROVENANCE=OFF -DFAULTDEBUG_PYTHON_EXECUTABLE="$(command -v python)"
      - name: Build native fixtures
        run: cmake --build build-ci --parallel 2
      - name: Runtime smoke
        run: |
          python3 -m faultdebug.cli run -- build-ci/test/fd_c_chain 16
          python3 test/crash_thread_generation.py build-ci/test/fd_c_chain
          test -x build-ci/test/fd_c_chain
      - name: Existing project adoption acceptance
        run: ctest --test-dir build-ci --output-on-failure -R '^fd_python_existing_project_adoption$'
      - name: Test real HTTP context with native recorder
        run: python3 test/shop_http_context.py --boundary build-ci/test/shop/libshop_boundary.so --runtime-dir build-ci
      - name: Test cross-process HTTP response loss, durable retry and restart
        run: python3 test/shop_http_retry.py --boundary build-ci/test/shop/libshop_boundary.so --runtime-dir build-ci --output build-ci/http-retry.json
      - name: Upload HTTP retry evidence
        uses: actions/upload-artifact@v4
        with:
          name: http-retry-evidence
          path: |
            build-ci/http-retry.json
            build-ci/http-retry-evidence/
          if-no-files-found: error
      - name: Test concurrent checkout and TCP fault recovery
        run: python3 test/shop_concurrency.py --boundary build-ci/test/shop/libshop_boundary.so --runtime-dir build-ci --output build-ci/shop-concurrency.json
      - name: Upload concurrent checkout evidence
        uses: actions/upload-artifact@v4
        with:
          name: shop-concurrency-evidence
          path: |
            build-ci/shop-concurrency.json
            build-ci/shop-concurrency-evidence/
          if-no-files-found: error
      - name: Record toolchain versions
        run: |
          clang-18 --version
          llvm-symbolizer-18 --version
